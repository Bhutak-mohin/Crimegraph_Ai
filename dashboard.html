<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrimeGraph AI — Investigator Console</title>
<meta name="description" content="Live investigator console with network graph, predictive intelligence, and disruption simulator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/dashboard.css">
<link rel="stylesheet" href="assets/css/uploader.css">
</head>
<body>
<div class="scanline"></div>
<div class="shell" id="shell"></div>
<div id="toast"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/case-uploader.js"></script>
<script>
/* ── Shell ─────────────────────────────────────────────────── */
document.getElementById('shell').innerHTML = buildSidebar('dashboard.html') + `
<div class="main">
  ${buildTopbar('Live Investigator Console','dash-search',`
    <button class="btn btn-sm" onclick="CaseUploader.open()" style="background:linear-gradient(135deg,#2563eb,#1d4ed8)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload Case File
    </button>
    <button class="btn btn-sm ghost" onclick="openNlpIngestModal()">⚡ Ingest Narrative</button>
    <button class="btn btn-sm ghost" id="export-top-btn">Export</button>
  `)}

  <!-- Tab Bar -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-graph-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Network Graph
    </button>
    <button class="tab-btn" id="tab-predictive-btn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Predictive Intelligence <span class="pulse"></span>
    </button>
  </div>

  <!-- ══ Network Graph View ════════════════════════════════ -->
  <div class="view active" id="view-graph">
    <div class="toolbar">
      <span>Network Graph View</span>
      <select id="layout-select">
        <option>Layout: Force-Directed</option>
        <option>Layout: Radial</option>
        <option>Layout: Hierarchical</option>
      </select>
      <select id="cluster-select">
        <option value="all">All Clusters</option>
        <option value="0">Cluster 0 — Maharashtra</option>
        <option value="1">Cluster 1 — Delhi NCR</option>
        <option value="2">Cluster 2 — Karnataka</option>
      </select>
      <div class="spacer"></div>
      <button class="btn ghost btn-sm" id="reset-btn">Reset View</button>
      <button class="btn btn-sm" id="export-btn">Export as Evidence</button>
    </div>

    <div class="layout">
      <!-- Filter Panel -->
      <aside id="filters-panel">
        <div class="panel-head">FILTERS</div>
        <div class="filter-group">
          <label class="title">Entity Type</label>
          <div class="chip-row" id="type-chips">
            <div class="chip active" data-type="person">Person</div>
            <div class="chip active" data-type="location">Location</div>
            <div class="chip active" data-type="vehicle">Vehicle</div>
            <div class="chip active" data-type="org">Organisation</div>
          </div>
        </div>
        <div class="filter-group">
          <label class="title">Minimum Risk Score</label>
          <div class="range-row">
            <input type="range" id="risk-range" min="0" max="100" value="0">
            <span class="range-val" id="risk-range-val">0</span>
          </div>
        </div>
        <div class="filter-group">
          <label class="title">Date Range</label>
          <select class="field" id="date-filter">
            <option>Last 90 days</option>
            <option>Last 6 months</option>
            <option>Last 12 months</option>
            <option>All records</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="title">Region / Jurisdiction</label>
          <select class="field" id="juris-filter">
            <option value="">All jurisdictions</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Delhi NCR">Delhi NCR</option>
            <option value="Karnataka">Karnataka</option>
            <option value="Inter-state">Inter-state</option>
          </select>
        </div>
        <div class="filter-group" style="border-bottom:none">
          <button class="btn apply-btn btn-sm" id="apply-btn">Apply Filters</button>
        </div>
        <div class="legend">
          <label class="title" style="font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--text-muted);text-transform:uppercase">Risk Legend</label>
          <div class="legend-row"><span class="sw" style="background:var(--risk-low)"></span> Low (0–40)</div>
          <div class="legend-row"><span class="sw" style="background:var(--risk-med)"></span> Medium (41–70)</div>
          <div class="legend-row"><span class="sw" style="background:var(--risk-high)"></span> High (71–100)</div>
          <div class="legend-row" style="margin-top:8px"><span class="sw" style="background:#3b82f6;border-radius:2px;width:14px;height:3px"></span> Strong Link</div>
          <div class="legend-row"><span class="sw" style="background:#37415c;border-radius:2px;width:14px;height:2px;border-top:2px dashed #37415c"></span> Weak Link</div>
        </div>
      </aside>

      <!-- Graph -->
      <div id="graph-wrap">
        <div class="graph-stats">
          <div class="stat-pill"><b id="stat-nodes">24</b>Entities</div>
          <div class="stat-pill"><b id="stat-links">28</b>Connections</div>
          <div class="stat-pill"><b id="stat-clusters">3</b>Clusters</div>
        </div>
        <svg id="graph"></svg>
        <div class="graph-caption">Click node to inspect · Drag to reposition · Scroll to zoom</div>
      </div>

      <!-- Details Panel -->
      <aside id="details-panel">
        <div class="panel-head">ENTITY DETAILS</div>
        <div id="details-body">
          <div class="empty-state">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Select a node in the network graph to view case-linked details, risk score, and associate history.
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- ══ Predictive Intelligence View ═════════════════════ -->
  <div class="view" id="view-predictive">
    <div class="toolbar">
      <span>Predictive Intelligence — Explainable Network Forecasting</span>
      <div class="toolbar-status">
        <span class="dot dot-live"></span> Model: GraphSAGE + NetworkX · Analyst-in-the-loop
      </div>
      <div class="spacer"></div>
      <select id="pred-horizon">
        <option value="7">Forecast: 7 days</option>
        <option value="14">Forecast: 14 days</option>
        <option value="30">Forecast: 30 days</option>
      </select>
      <button class="btn ghost btn-sm" id="refresh-predictions-btn">Recalculate</button>
      <button class="btn ghost btn-sm" id="disrupt-reset-btn">Restore Network</button>
    </div>

    <!-- Summary Bar -->
    <div class="pred-summary">
      <div class="pred-summary-card">
        <div class="summary-label">EMERGING SIGNAL</div>
        <div class="summary-value" id="summary-threat" style="color:var(--risk-high)">HIGH</div>
        <div class="summary-sub" id="summary-threat-sub">3 clusters show increasing connectivity</div>
      </div>
      <div class="pred-summary-card">
        <div class="summary-label">PREDICTED LINKS</div>
        <div class="summary-value" id="summary-links">6</div>
        <div class="summary-sub">candidate links above model threshold</div>
      </div>
      <div class="pred-summary-card">
        <div class="summary-label">MODEL CONFIDENCE</div>
        <div class="summary-value" id="summary-confidence">87%</div>
        <div class="summary-sub">aggregate across active signals</div>
      </div>
      <div class="pred-summary-card">
        <div class="summary-label">ANALYST REVIEW</div>
        <div class="summary-value" id="summary-review">6</div>
        <div class="summary-sub">leads awaiting human validation</div>
      </div>
    </div>

    <div style="flex:1;display:flex;min-height:0" id="predictive-layout">
      <!-- Predictions Panel -->
      <aside id="predictions-panel">
        <div class="panel-head">PREDICTED ASSOCIATIONS</div>
        <div class="panel-note">Potential relationships identified from structural similarity, shared entities and network proximity. Predictions are leads, not attribution.</div>
        <div id="predictions-list"></div>
      </aside>

      <!-- Disruption Simulator -->
      <div id="disruption-wrap">
        <div class="pred-section-title">
          <div>
            <b>Network Evolution &amp; Intervention Simulator</b>
            <span>Click a node to simulate removal and measure structural impact.</span>
          </div>
          <div class="forecast-chip" id="forecast-chip">7-DAY FORECAST</div>
        </div>
        <div class="disrupt-stats">
          <div class="dstat"><b id="dstat-cohesion">100%</b>Network Cohesion</div>
          <div class="dstat"><b id="dstat-fragments">3</b>Active Fragments</div>
          <div class="dstat"><b id="dstat-largest">21</b>Largest Cluster</div>
          <div class="dstat warn"><b id="dstat-neutralized">0</b>Simulated Removed</div>
          <div class="dstat"><b id="dstat-impact">0%</b>Fragmentation Impact</div>
        </div>
        <div class="forecast-strip">
          <div class="forecast-title">ACTIVITY TRAJECTORY</div>
          <div class="forecast-chart" id="forecast-chart"></div>
          <div class="forecast-legend">
            <span class="legend-line current"></span>Observed
            <span class="legend-line forecast"></span>Forecast
          </div>
        </div>
        <svg id="disruption-graph"></svg>
        <div class="disrupt-caption" style="position:relative;left:auto;transform:none;text-align:center;margin:0 auto 10px">
          Simulation only · no operational action is taken · analyst validation required before escalation
        </div>
      </div>

      <!-- Targets Panel -->
      <aside id="targets-panel">
        <div class="panel-head">AI RECOMMENDED TARGETS</div>
        <div class="panel-note">Ranked by structural centrality and estimated network fragmentation impact. Investigation priorities — not guilt determinations.</div>
        <div id="targets-list"></div>
        <div class="panel-head target-detail-head">SELECTED SIGNAL</div>
        <div id="target-detail">
          <div class="empty-state">Select a predicted association or target to inspect the model rationale and evidence path.</div>
        </div>
      </aside>
    </div>
  </div>
</div>`;

/* ═══════════════════════════════════════════════════════════
   GRAPH MODULE
═══════════════════════════════════════════════════════════ */
const { nodes, links, predictedLinks, riskColor, riskLevel, esc, findAssociates, initials, avatarColor, forecastSeries } = CG;

const graphWrap = document.getElementById('graph-wrap');
const svg = d3.select('#graph');
let width = graphWrap.clientWidth, height = graphWrap.clientHeight;

const container = svg.append('g');
svg.call(d3.zoom().scaleExtent([0.3, 4]).on('zoom', e => container.attr('transform', e.transform)));

const clonedLinks = links.map(l => ({...l}));
const clonedNodes = nodes.map(n => ({...n}));

const linkSel = container.append('g').selectAll('line')
  .data(clonedLinks).join('line')
  .attr('class', d => 'link' + (d.weak ? ' weak' : ''))
  .attr('stroke-width', d => d.weak ? 1 : 1.7);

const nodeSel = container.append('g').selectAll('g')
  .data(clonedNodes).join('g').attr('class','node')
  .call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y;})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

nodeSel.append('circle')
  .attr('r', d => 7 + d.associates * 0.9)
  .attr('fill', d => riskColor(d.risk));

nodeSel.append('text')
  .attr('dy', d => -(11 + d.associates * 0.9))
  .attr('text-anchor','middle').text(d => d.id);

nodeSel.on('click', (e,d) => { e.stopPropagation(); selectNode(d); });

const sim = d3.forceSimulation(clonedNodes)
  .force('link', d3.forceLink(clonedLinks).id(d=>d.id).distance(72).strength(.35))
  .force('charge', d3.forceManyBody().strength(-200))
  .force('center', d3.forceCenter(width/2, height/2))
  .force('collision', d3.forceCollide().radius(d => 18+d.associates))
  .on('tick', () => {
    linkSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
           .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`);
  });

svg.on('click', () => {
  selectedId = null; clearHighlight();
  document.getElementById('details-body').innerHTML =
    '<div class="empty-state"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Select a node in the network graph to view case-linked details, risk score, and associate history.</div>';
});

let selectedId = null;
function selectNode(d) {
  selectedId = d.id;
  nodeSel.classed('selected', n => n.id === d.id);
  renderDetails(d);
  highlightNeighborhood(d.id);
}
function highlightNeighborhood(id) {
  const nb = new Set([id]);
  clonedLinks.forEach(l => {
    const s=l.source.id||l.source, t=l.target.id||l.target;
    if(s===id)nb.add(t); if(t===id)nb.add(s);
  });
  nodeSel.classed('dim', d => !nb.has(d.id));
  linkSel.style('opacity', l => {
    const s=l.source.id||l.source, t=l.target.id||l.target;
    return (nb.has(s)&&nb.has(t)) ? 1 : 0.05;
  });
}
function clearHighlight() {
  nodeSel.classed('dim',false).classed('selected',false);
  linkSel.style('opacity',1);
}
function renderDetails(d) {
  const assoc = findAssociates(d.id);
  const rc = riskColor(d.risk);
  document.getElementById('details-body').innerHTML = `
    <div class="entity-card">
      <div class="entity-top">
        <div class="avatar" style="background:${avatarColor(d.type)}">${initials(d.id)}</div>
        <div>
          <div class="entity-name">${esc(d.id)}</div>
          <div class="entity-alias">${d.alias!=='—'?'Alias: "'+d.alias+'"':d.type[0].toUpperCase()+d.type.slice(1)}</div>
        </div>
      </div>
      <div class="risk-block">
        <div class="risk-label"><span>Risk Score</span><span style="color:${rc};font-weight:700">${d.risk} / 100</span></div>
        <div class="risk-bar-wrap"><div class="risk-bar-fill" style="width:${d.risk}%;background:${rc}"></div></div>
      </div>
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${d.cases}</div><div class="l">Linked Cases</div></div>
        <div class="stat-box"><div class="n">${d.associates}</div><div class="l">Associates</div></div>
      </div>
      <div class="kv"><span>Last Activity</span><span>${d.lastActivity}</span></div>
      <div class="kv"><span>Jurisdiction</span><span>${d.jurisdiction}</span></div>
      <div class="kv"><span>Entity Type</span><span>${d.type[0].toUpperCase()+d.type.slice(1)}</span></div>
      <div class="kv" style="border-bottom:none"><span>Cluster</span><span>${['Maharashtra','Delhi NCR','Karnataka'][d.cluster]}</span></div>
      <div class="assoc-list">
        <label style="font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--text-muted);text-transform:uppercase">Directly Linked To</label>
        ${assoc.map(a=>{const n=nodes.find(x=>x.id===a);return `<div class="assoc-item"><span class="assoc-dot" style="background:${riskColor(n.risk)}"></span>${esc(a)}<span class="badge badge-${riskLevel(n.risk)}" style="margin-left:auto;font-size:10px">${n.risk}</span></div>`;}).join('')}
      </div>
      <button class="btn report-btn btn-sm" id="report-btn">📄 Generate Forensic Report</button>
    </div>`;
  document.getElementById('report-btn').onclick = () => {
    showToast(`Opening forensic report for ${d.id}…`, 'ok');
    setTimeout(() => window.location.href = `reports.html?entity=${encodeURIComponent(d.id)}`, 500);
  };
}

/* ── Filters ──────────────────────────────────────────────── */
document.querySelectorAll('#type-chips .chip').forEach(c => c.addEventListener('click', () => c.classList.toggle('active')));
const riskRange = document.getElementById('risk-range');
riskRange.addEventListener('input', () => document.getElementById('risk-range-val').textContent = riskRange.value);

document.getElementById('apply-btn').addEventListener('click', () => {
  const types = [...document.querySelectorAll('#type-chips .chip.active')].map(c=>c.dataset.type);
  const minR  = +riskRange.value;
  const juris = document.getElementById('juris-filter').value;
  nodeSel.style('display', d => {
    const ok = types.includes(d.type) && d.risk >= minR && (!juris || d.jurisdiction.includes(juris));
    return ok ? null : 'none';
  });
  linkSel.style('display', l => {
    const s=l.source, t=l.target;
    const sOk = types.includes(s.type)&&s.risk>=minR&&(!juris||s.jurisdiction.includes(juris));
    const tOk = types.includes(t.type)&&t.risk>=minR&&(!juris||t.jurisdiction.includes(juris));
    return (sOk&&tOk) ? null : 'none';
  });
  const vis = clonedNodes.filter(d=>types.includes(d.type)&&d.risk>=minR&&(!juris||d.jurisdiction.includes(juris))).length;
  document.getElementById('stat-nodes').textContent = vis;
  showToast(`Filters applied — showing ${vis} of ${nodes.length} entities`);
});

document.getElementById('reset-btn').addEventListener('click', () => {
  document.querySelectorAll('#type-chips .chip').forEach(c=>c.classList.add('active'));
  riskRange.value = 0; document.getElementById('risk-range-val').textContent = '0';
  nodeSel.style('display',null); linkSel.style('display',null);
  document.getElementById('stat-nodes').textContent = nodes.length;
  selectedId=null; clearHighlight(); sim.alpha(.5).restart();
  document.getElementById('juris-filter').value='';
  showToast('View reset — all entities visible');
});

document.getElementById('export-btn').addEventListener('click', () => showToast('Network snapshot exported for case evidence log','ok'));
document.getElementById('export-top-btn').addEventListener('click', () => showToast('Network snapshot exported for case evidence log','ok'));

/* ── Search ───────────────────────────────────────────────── */
document.getElementById('dash-search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { clearHighlight(); return; }
  const m = clonedNodes.find(n => n.id.toLowerCase().includes(q)||(n.alias&&n.alias.toLowerCase().includes(q)));
  if (m) selectNode(m);
});

/* ── Cluster filter ───────────────────────────────────────── */
document.getElementById('cluster-select').addEventListener('change', e => {
  const v = e.target.value;
  if (v==='all') { nodeSel.style('display',null); linkSel.style('display',null); document.getElementById('stat-nodes').textContent=nodes.length; return; }
  const ci = +v;
  nodeSel.style('display', d => d.cluster===ci ? null : 'none');
  linkSel.style('display', l => (l.source.cluster===ci&&l.target.cluster===ci) ? null : 'none');
  const vis = clonedNodes.filter(d=>d.cluster===ci).length;
  document.getElementById('stat-nodes').textContent = vis;
});

/* ── Tab switching ─────────────────────────────────────────── */
document.getElementById('tab-graph-btn').addEventListener('click', () => {
  document.getElementById('tab-graph-btn').classList.add('active');
  document.getElementById('tab-predictive-btn').classList.remove('active');
  document.getElementById('view-graph').classList.add('active');
  document.getElementById('view-predictive').classList.remove('active');
});
document.getElementById('tab-predictive-btn').addEventListener('click', () => {
  document.getElementById('tab-predictive-btn').classList.add('active');
  document.getElementById('tab-graph-btn').classList.remove('active');
  document.getElementById('view-predictive').classList.add('active');
  document.getElementById('view-graph').classList.remove('active');
  setTimeout(() => { renderForecast(); const dw=document.getElementById('disruption-wrap'); dSim.force('center',d3.forceCenter(dw.clientWidth/2,(dw.clientHeight-180)/2)).alpha(.3).restart(); }, 30);
});

/* ── Resize ─────────────────────────────────────────────────── */
window.addEventListener('resize', () => {
  width=graphWrap.clientWidth; height=graphWrap.clientHeight;
  sim.force('center',d3.forceCenter(width/2,height/2)).alpha(.3).restart();
});

/* ═══════════════════════════════════════════════════════════
   PREDICTIVE INTELLIGENCE MODULE
═══════════════════════════════════════════════════════════ */
const predState = { removed:new Set(), selectedTarget:null, selectedPrediction:null, horizon:7 };
const pLinks = predictedLinks.map(l=>({...l}));

function renderPredictions() {
  document.getElementById('predictions-list').innerHTML = pLinks.map((p,i) => `
    <div class="pred-item ${predState.selectedPrediction===i?'open':''}" data-pred="${i}">
      <div class="pred-pair">
        <span>${esc(p.source)}</span><span class="arrow">→</span><span>${esc(p.target)}</span>
        <span class="pred-score-badge">${Math.round(p.score*100)}%</span>
      </div>
      <div class="pred-conf-row">
        <div class="pred-conf-bar"><div class="pred-conf-fill" style="width:${p.score*100}%"></div></div>
        <span class="pred-conf-num">confidence</span>
      </div>
      <div class="pred-evidence"><strong>Why:</strong> ${esc(p.reasons[0])}</div>
      <div class="pred-path">
        ${p.reasons.map((r,j)=>`<div class="pred-step"><span class="num">${j+1}</span><span>${esc(r)}</span></div>`).join('')}
        <div class="pred-verdict">Lead only — validate against source records before escalation.</div>
        <div class="pred-actions">
          <button class="mini-btn primary pred-inspect" data-i="${i}">Inspect signal</button>
          <button class="mini-btn ${p.status==='Validated'?'validated':''} pred-validate" data-i="${i}">${p.status==='Validated'?'✓ Validated':'Mark validated'}</button>
        </div>
      </div>
    </div>`).join('');

  document.querySelectorAll('.pred-item').forEach(el => el.addEventListener('click', e => {
    if(e.target.closest('button')) return;
    const i=+el.dataset.pred; predState.selectedPrediction = predState.selectedPrediction===i ? null : i; renderPredictions();
  }));
  document.querySelectorAll('.pred-inspect').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation(); const p=pLinks[+btn.dataset.i]; predState.selectedPrediction=+btn.dataset.i; predState.selectedTarget=null; renderPredictions(); showSignalDetail(p);
  }));
  document.querySelectorAll('.pred-validate').forEach(btn => btn.addEventListener('click', e => {
    e.stopPropagation(); const p=pLinks[+btn.dataset.i]; p.status='Validated'; predState.selectedPrediction=+btn.dataset.i; renderPredictions(); updatePredSummary(); showToast(`Analyst validation recorded for ${p.source} → ${p.target}`,'ok');
  }));
}

function calcTargets() {
  const deg = new Map(nodes.map(n=>[n.id,0]));
  links.forEach(l=>{ const s=l.source.id||l.source,t=l.target.id||l.target; deg.set(s,(deg.get(s)||0)+1); deg.set(t,(deg.get(t)||0)+1); });
  return nodes.map(n=>{
    const d=deg.get(n.id)||0;
    const cross=links.filter(l=>{ const s=l.source.id||l.source,t=l.target.id||l.target; if(s!==n.id&&t!==n.id)return false; const o=s===n.id?t:s; const on=nodes.find(x=>x.id===o); return on&&on.cluster!==n.cluster; }).length;
    const impact=Math.min(96,Math.round((d*11)+(cross*10)+(n.risk*.28)));
    return {node:n,impact,degree:d,cross};
  }).sort((a,b)=>b.impact-a.impact).slice(0,7);
}

function renderTargets() {
  const targets=calcTargets();
  document.getElementById('targets-list').innerHTML=targets.map((t,i)=>`
    <div class="target-item ${predState.selectedTarget===t.node.id?'selected':''}" data-target="${esc(t.node.id)}">
      <div class="target-rank">${i+1}</div>
      <div class="target-info">
        <div class="target-name">${esc(t.node.id)}</div>
        <div class="target-reason">${t.degree} links · ${t.cross} cross-cluster · risk ${t.node.risk}</div>
      </div>
      <div class="pred-score-badge">${t.impact}%</div>
    </div>`).join('');
  document.querySelectorAll('.target-item').forEach(el => el.addEventListener('click', () => {
    predState.selectedTarget=el.dataset.target; predState.selectedPrediction=null; renderTargets();
    const t=targets.find(x=>x.node.id===el.dataset.target); if(t) showSignalDetail(t); focusDisruptionNode(el.dataset.target);
  }));
}

function showSignalDetail(item) {
  const el=document.getElementById('target-detail');
  if(item.node) {
    el.innerHTML=`<div class="signal-card">
      <div class="signal-title">${esc(item.node.id)}</div>
      <div class="signal-sub">Recommended review target · structural impact ${item.impact}%</div>
      <div class="confidence-row"><div class="confidence-label"><span>Estimated fragmentation impact</span><b>${item.impact}%</b></div><div class="confidence-bar"><div class="confidence-fill" style="width:${item.impact}%"></div></div></div>
      <div class="evidence-box"><div class="ev-title">MODEL RATIONALE</div>
        <div class="ev-row"><b>Network degree:</b> ${item.degree} direct relationships</div>
        <div class="ev-row"><b>Cross-cluster links:</b> ${item.cross}</div>
        <div class="ev-row"><b>Risk signal:</b> ${item.node.risk}/100</div>
        <div class="ev-row"><b>Interpretation:</b> Removal is simulated to reduce connectivity — not a finding of culpability.</div>
      </div>
      <button class="btn btn-sm report-btn" style="margin-top:10px" id="simulate-target-btn">Simulate Removal</button>
    </div>`;
    document.getElementById('simulate-target-btn').onclick = () => neutralizeNode(item.node.id);
    return;
  }
  const p=item;
  el.innerHTML=`<div class="signal-card">
    <div class="signal-title">${esc(p.source)} → ${esc(p.target)}</div>
    <div class="signal-sub">Predicted association · ${Math.round(p.score*100)}% confidence</div>
    <div class="confidence-row"><div class="confidence-label"><span>Prediction confidence</span><b>${Math.round(p.score*100)}%</b></div><div class="confidence-bar"><div class="confidence-fill" style="width:${p.score*100}%"></div></div></div>
    <div class="evidence-box"><div class="ev-title">EXPLAINABLE EVIDENCE PATH</div>
      ${p.reasons.map((r,i)=>`<div class="ev-row"><b>${i+1}.</b> ${esc(r)}</div>`).join('')}
      <div class="ev-row"><b>Validation:</b> Compare with source records before treating as actionable.</div>
    </div>
  </div>`;
  focusDisruptionNode(p.source, p.target);
}

function updatePredSummary() {
  const val=pLinks.filter(p=>p.status==='Validated').length;
  const avg=Math.round(pLinks.reduce((a,p)=>a+p.score,0)/pLinks.length*100);
  document.getElementById('summary-links').textContent=pLinks.length;
  document.getElementById('summary-confidence').textContent=avg+'%';
  document.getElementById('summary-review').textContent=pLinks.length-val;
  const th=avg>=82?'HIGH':avg>=65?'MEDIUM':'LOW';
  const thEl=document.getElementById('summary-threat');
  thEl.textContent=th;
  thEl.style.color=th==='HIGH'?'var(--risk-high)':th==='MEDIUM'?'var(--risk-med)':'var(--risk-low)';
}

function renderForecast() {
  const el=document.getElementById('forecast-chart');
  const w=Math.max(240,el.clientWidth||320), h=42, p=3;
  const svg2=d3.select(el).html('').append('svg').attr('viewBox',`0 0 ${w} ${h}`);
  const x=d3.scaleLinear().domain([0,forecastSeries.length-1]).range([p,w-p]);
  const y=d3.scaleLinear().domain([20,90]).range([h-p,p]);
  const line=d3.line().x((d,i)=>x(i)).y(d=>y(d)).curve(d3.curveMonotoneX);
  svg2.append('path').datum(forecastSeries.slice(0,8)).attr('d',line).attr('fill','none').attr('stroke','#6b7280').attr('stroke-width',1.5);
  const fx=d3.scaleLinear().domain([0,6]).range([x(7),w-p]);
  const forecast=[forecastSeries[7],59,63,68,74,78,82];
  svg2.append('path').datum(forecast).attr('d',d3.line().x((d,i)=>fx(i)).y(d=>y(d)).curve(d3.curveMonotoneX)).attr('fill','none').attr('stroke','var(--accent)').attr('stroke-width',2).attr('stroke-dasharray','5 3');
  svg2.append('line').attr('x1',x(7)).attr('x2',x(7)).attr('y1',3).attr('y2',h-3).attr('stroke','#37415c').attr('stroke-dasharray','2 2');
}

document.getElementById('pred-horizon').addEventListener('change', e => {
  predState.horizon=+e.target.value;
  document.getElementById('forecast-chip').textContent=`${predState.horizon}-DAY FORECAST`;
  showToast(`Forecast horizon updated to ${predState.horizon} days`); renderForecast();
});
document.getElementById('refresh-predictions-btn').addEventListener('click', () => {
  pLinks.forEach((p,i) => p.score=Math.max(.65,Math.min(.96,p.score+(i%2?.012:-.006))));
  renderPredictions(); renderTargets(); updatePredSummary(); renderForecast();
  showToast('Predictive signals recalculated from current network','ok');
});

/* ── Disruption Simulator ─────────────────────────────────── */
const disruptSvg=d3.select('#disruption-graph');
const disruptWrap=document.getElementById('disruption-wrap');
let dw=800, dh=300;

const dCon=disruptSvg.append('g');
disruptSvg.call(d3.zoom().scaleExtent([.4,3]).on('zoom',e=>dCon.attr('transform',e.transform)));

const dNodes=nodes.map(n=>({...n}));
const dLinks=links.map(l=>({source:l.source.id||l.source,target:l.target.id||l.target,weak:l.weak}));
const pVisLinks=predictedLinks.map(p=>({source:p.source,target:p.target,predicted:true}));
const allDLinks=[...dLinks,...pVisLinks];

const dlSel=dCon.append('g').selectAll('line').data(allDLinks).join('line')
  .attr('class',d=>'disrupt-link'+(d.predicted?' predicted':''))
  .attr('stroke-width',d=>d.predicted?1.3:(d.weak?1:1.5));
const dnSel=dCon.append('g').selectAll('g').data(dNodes).join('g').attr('class','disrupt-node')
  .call(d3.drag()
    .on('start',(e,d)=>{if(!e.active)dSim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y;})
    .on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;})
    .on('end',(e,d)=>{if(!e.active)dSim.alphaTarget(0);d.fx=null;d.fy=null;}));
dnSel.append('circle').attr('r',d=>5+d.associates*.65).attr('fill',d=>riskColor(d.risk));
dnSel.append('text').attr('dy',d=>-(8+d.associates*.65)).attr('text-anchor','middle').text(d=>d.id);
dnSel.on('click',(e,d)=>{e.stopPropagation();neutralizeNode(d.id);});

const dSim=d3.forceSimulation(dNodes)
  .force('link',d3.forceLink(dLinks).id(d=>d.id).distance(58).strength(.28))
  .force('charge',d3.forceManyBody().strength(-120))
  .force('center',d3.forceCenter(400,200))
  .force('collision',d3.forceCollide().radius(d=>14+d.associates*.65))
  .on('tick',()=>{
    dlSel.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
    dnSel.attr('transform',d=>`translate(${d.x},${d.y})`);
  });

function netMetrics() {
  const active=dNodes.filter(n=>!predState.removed.has(n.id));
  const aIds=new Set(active.map(n=>n.id));
  const adj=new Map(active.map(n=>[n.id,[]]));
  dLinks.forEach(l=>{const s=l.source.id||l.source,t=l.target.id||l.target;if(aIds.has(s)&&aIds.has(t)){adj.get(s).push(t);adj.get(t).push(s);}});
  const seen=new Set(),sizes=[];
  for(const n of active){if(seen.has(n.id))continue;let q=[n.id],sz=0;seen.add(n.id);while(q.length){const x=q.pop();sz++;for(const y of adj.get(x)){if(!seen.has(y)){seen.add(y);q.push(y);}}}sizes.push(sz);}
  sizes.sort((a,b)=>b-a);
  const largest=sizes[0]||0, frags=sizes.length, cohesion=Math.round((largest/Math.max(1,active.length))*100);
  const impact=Math.max(0,Math.round((1-(largest/Math.max(1,nodes.length)))*100));
  return {frags,largest,cohesion,impact};
}
function updateDisruptStats() {
  const m=netMetrics();
  document.getElementById('dstat-cohesion').textContent=m.cohesion+'%';
  document.getElementById('dstat-fragments').textContent=m.frags;
  document.getElementById('dstat-largest').textContent=m.largest;
  document.getElementById('dstat-neutralized').textContent=predState.removed.size;
  document.getElementById('dstat-impact').textContent=m.impact+'%';
  dnSel.classed('neutralized',d=>predState.removed.has(d.id));
  dlSel.style('opacity',d=>{const s=d.source.id||d.source,t=d.target.id||d.target;return predState.removed.has(s)||predState.removed.has(t)?.06:1;});
}
function neutralizeNode(id) {
  if(predState.removed.has(id))predState.removed.delete(id);else predState.removed.add(id);
  updateDisruptStats(); renderTargets();
  const el=document.getElementById('disruption-wrap');
  el.classList.remove('impact-flash'); void el.offsetWidth; el.classList.add('impact-flash');
  showToast(predState.removed.has(id)?`${id} simulated as removed from network`:`${id} restored to active network`);
}
function focusDisruptionNode(a,b) {
  dnSel.classed('focus',d=>d.id===a||d.id===b);
  setTimeout(()=>dnSel.classed('focus',false),1600);
}
document.getElementById('disrupt-reset-btn').addEventListener('click',()=>{
  predState.removed.clear(); updateDisruptStats(); renderTargets(); showToast('Network simulation restored');
});

/* ── Layout switching ─────────────────────────────────────── */
document.getElementById('layout-select').addEventListener('change', e => {
  applyGraphLayout(e.target.value);
});

function applyGraphLayout(layoutName) {
  if (layoutName.includes('Radial')) {
    sim.stop();
    const cx = width / 2, cy = height / 2;
    clonedNodes.forEach((n, i) => {
      const ring = n.risk > 70 ? 110 : n.risk > 40 ? 210 : 310;
      const group = clonedNodes.filter(x => (n.risk > 70 ? x.risk > 70 : n.risk > 40 ? (x.risk > 40 && x.risk <= 70) : x.risk <= 40));
      const idx = group.indexOf(n);
      const angle = (idx / Math.max(1, group.length)) * 2 * Math.PI;
      n.fx = cx + ring * Math.cos(angle);
      n.fy = cy + ring * Math.sin(angle);
    });
    sim.alpha(0.35).restart();
    setTimeout(() => { clonedNodes.forEach(n => { n.fx = null; n.fy = null; }); }, 1400);
    showToast('Radial Layout — Concentric Risk Rings (High Core → Low Perimeter)');
  } else if (layoutName.includes('Hierarchical')) {
    sim.stop();
    const tiers = [
      clonedNodes.filter(n => n.risk > 70),
      clonedNodes.filter(n => n.risk > 40 && n.risk <= 70),
      clonedNodes.filter(n => n.risk <= 40)
    ];
    tiers.forEach((tier, rowIdx) => {
      const y = 80 + rowIdx * ((height - 160) / 2);
      tier.forEach((n, colIdx) => {
        const x = 70 + colIdx * ((width - 140) / Math.max(1, tier.length - 1 || 1));
        n.fx = x;
        n.fy = y;
      });
    });
    sim.alpha(0.35).restart();
    setTimeout(() => { clonedNodes.forEach(n => { n.fx = null; n.fy = null; }); }, 1400);
    showToast('Hierarchical Layout — Organised by Risk & Centrality Tiers');
  } else {
    clonedNodes.forEach(n => { n.fx = null; n.fy = null; });
    sim.force('charge', d3.forceManyBody().strength(-200))
       .force('center', d3.forceCenter(width / 2, height / 2))
       .alpha(0.5).restart();
    showToast('Force-Directed Layout — Dynamic Physics Simulation');
  }
}

/* ── Init ────────────────────────────────────────────────── */
document.getElementById('stat-nodes').textContent = nodes.length;
document.getElementById('stat-links').textContent = links.length;
document.getElementById('stat-clusters').textContent = new Set(nodes.map(n => n.cluster)).size;

renderPredictions(); renderTargets(); updatePredSummary(); updateDisruptStats();
setTimeout(renderForecast, 60);
setTimeout(renderForecast, 300);

/* ── Handle URL Parameters ────────────────────────────────── */
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  if (params.get('tab') === 'predictive') {
    document.getElementById('tab-predictive-btn').click();
  }
  
  if (params.get('disrupt')) {
    const disId = params.get('disrupt');
    document.getElementById('tab-predictive-btn').click();
    setTimeout(() => {
      neutralizeNode(disId);
      showToast(`Simulating disruption on target: ${disId}`, 'ok');
    }, 450);
  }

  if (params.get('entity')) {
    const entId = params.get('entity');
    const match = clonedNodes.find(n => n.id.toLowerCase() === entId.toLowerCase());
    if (match) {
      setTimeout(() => selectNode(match), 400);
      showToast(`Selected subject: ${match.id}`, 'ok');
    }
  } else if (params.get('case')) {
    const caseId = params.get('case');
    const targetCase = CG.cases.find(c => c.id.toLowerCase() === caseId.toLowerCase());
    if (targetCase && targetCase.suspects.length) {
      const suspectSet = new Set(targetCase.suspects);
      nodeSel.classed('dim', d => !suspectSet.has(d.id));
      linkSel.style('opacity', l => (suspectSet.has(l.source.id || l.source) && suspectSet.has(l.target.id || l.target)) ? 1 : 0.05);
      const firstSuspect = clonedNodes.find(n => suspectSet.has(n.id));
      if (firstSuspect) setTimeout(() => selectNode(firstSuspect), 400);
      showToast(`Filtered graph to Case ${targetCase.id} (${targetCase.title})`);
    }
  }
});
