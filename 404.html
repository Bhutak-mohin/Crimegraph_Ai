      background: #06141f;

    }
    .card {
      text-align: center;
      background: rgba(15, 23, 42, 0.9);

    p { margin: 0 0 20px; color: #cbd5e1; }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
    }

</head>
<body>
  <div class="card">
