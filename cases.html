<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrimeGraph AI — Case Management</title>
<meta name="description" content="Manage active investigations, FIRs, and case files across all jurisdictions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/cases.css">
<link rel="stylesheet" href="assets/css/uploader.css">
</head>
<body>
<div class="scanline"></div>
<div class="shell" id="shell"></div>

<!-- Drawer Overlay -->
<div class="drawer-overlay" id="drawer-overlay">
  <div class="drawer" id="case-drawer">
    <div class="drawer-header">
      <div id="drawer-icon" style="font-size:22px"></div>
      <div style="min-width:0">
        <div class="drawer-title" id="drawer-title">Case Details</div>
        <div style="font-size:11px;color:var(--text-muted)" id="drawer-id"></div>
      </div>
      <div style="display:flex;gap:8px;margin-left:auto">
        <span id="drawer-status-badge"></span>
        <button class="btn ghost btn-sm" id="drawer-report-btn">📄 Report</button>
        <button class="icon-btn" id="drawer-close-btn" title="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>

<!-- New Case Modal -->
<div class="modal-overlay" id="new-case-overlay">
  <div class="modal new-case-modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <h2 style="font-size:18px">New Case</h2>
      <button class="icon-btn" id="close-new-case">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>FIR Number</label>
        <input class="field" type="text" placeholder="MH-2024-0XXX" id="nc-fir">
      </div>
      <div class="form-group">
        <label>Case Type</label>
        <select class="field" id="nc-type">
          <option>Organised Crime</option>
          <option>Financial Crime</option>
          <option>Smuggling</option>
          <option>Vehicle Crime</option>
          <option>Surveillance</option>
          <option>Cybercrime</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Case Title</label>
      <input class="field" type="text" placeholder="Operation Name or Brief Description" id="nc-title">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea class="field" rows="3" placeholder="Brief summary of the case..." id="nc-desc" style="resize:vertical"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Jurisdiction</label>
        <select class="field" id="nc-juris">
          <option>Maharashtra</option>
          <option>Delhi NCR</option>
          <option>Karnataka</option>
          <option>Inter-state</option>
        </select>
      </div>
      <div class="form-group">
        <label>Initial Risk Level</label>
        <select class="field" id="nc-risk">
          <option value="30">Low</option>
          <option value="55">Medium</option>
          <option value="80" selected>High</option>
        </select>
      </div>
    </div>
    <button class="btn w-full" style="margin-top:16px;padding:11px" id="create-case-btn">Create Case &amp; Assign to Network</button>
  </div>
</div>

<div id="toast"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/case-uploader.js"></script>
<script>
document.getElementById('shell').innerHTML = buildSidebar('cases.html') + `
<div class="main">
  ${buildTopbar('Case Management','cases-search',`
    <button class="btn btn-sm" onclick="CaseUploader.open()" style="background:linear-gradient(135deg,#2563eb,#1d4ed8)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload Case File
    </button>
    <button class="btn ghost btn-sm" id="new-case-btn">+ New Manual Case</button>
  `)}
  <div style="flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden" id="cases-root"></div>
</div>`;

const { cases, nodes, riskColor, riskLevel, esc, initials, avatarColor } = CG;

/* ── Render Cases ──────────────────────────────────────────── */
let filtered = [...cases];

function renderCases(list) {
  const root = document.getElementById('cases-root');
  root.innerHTML = `
  <div class="cases-toolbar">
    <h2>All Active Investigations</h2>
    <div class="cases-count">${list.length} case${list.length!==1?'s':''}</div>
    <div class="spacer" style="flex:1"></div>
    <button class="btn btn-sm" onclick="CaseUploader.open()" style="padding:5px 11px;font-size:11.5px">
      📁 Upload Digital FIR
    </button>
    <select class="field" style="width:auto" id="sort-select">
      <option value="risk">Sort: Highest Risk</option>
      <option value="date">Sort: Most Recent</option>
      <option value="status">Sort: Status</option>
    </select>
  </div>
  <div class="cases-layout">
    <div class="cases-sidebar">
      <div class="cases-sidebar-head">Filter Cases</div>
      <div class="cases-filters">
        <div>
          <div class="filter-label">Status</div>
          <div class="chip-row" id="status-chips">
            <div class="chip active" data-status="Active">Active</div>
            <div class="chip active" data-status="Under Review">Review</div>
            <div class="chip active" data-status="Closed">Closed</div>
          </div>
        </div>
        <div>
          <div class="filter-label">Jurisdiction</div>
          <select class="field" id="juris-select">
            <option value="">All Jurisdictions</option>
            <option value="Maharashtra">Maharashtra</option>
            <option value="Delhi NCR">Delhi NCR</option>
            <option value="Karnataka">Karnataka</option>
          </select>
        </div>
        <div>
          <div class="filter-label">Case Type</div>
          <select class="field" id="type-select">
            <option value="">All Types</option>
            <option value="Organised Crime">Organised Crime</option>
            <option value="Financial Crime">Financial Crime</option>
            <option value="Smuggling">Smuggling</option>
            <option value="Vehicle Crime">Vehicle Crime</option>
            <option value="Surveillance">Surveillance</option>
          </select>
        </div>
        <div>
          <div class="filter-label">Min Risk Score</div>
          <div class="range-row">
            <input type="range" id="case-risk-range" min="0" max="100" value="0" style="accent-color:var(--accent)">
            <span class="range-val" id="case-risk-val">0</span>
          </div>
        </div>
        <button class="btn btn-sm" id="apply-case-filters">Apply Filters</button>
      </div>
    </div>
    <div class="cases-main" id="cases-list-wrap">
      <!-- AI Case Ingestion Hero Banner -->
      <div class="case-upload-hero-banner">
        <div class="cuh-left">
          <div class="cuh-icon">⚡</div>
          <div class="cuh-text">
            <h3>Digital Case File Ingestion &amp; Automated Extraction</h3>
            <p>Upload electronic copies of FIRs, case diaries, or interrogation transcripts. The system resolves entities, maps syndicate bridges, and computes GraphSAGE risk scores automatically.</p>
          </div>
        </div>
        <div class="cuh-actions">
          <button class="btn btn-sm" onclick="CaseUploader.open()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload Digital Case
          </button>
        </div>
      </div>
      <div id="cases-list" style="display:flex;flex-direction:column;gap:12px"></div>
    </div>
  </div>`;

  renderCaseCards(list);
  attachFilterHandlers();
}

function renderCaseCards(list) {
  const el = document.getElementById('cases-list');
  if (!list.length) {
    el.innerHTML = '<div class="empty-state" style="height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:40px;opacity:.2;margin-bottom:12px">📁</div>No cases match the current filters.</div>';
    return;
  }
  el.innerHTML = list.map(c => `
    <div class="case-card ${c.riskLevel}" data-cid="${c.id}" style="cursor:pointer">
      <div class="case-icon">${c.icon}</div>
      <div class="case-meta">
        <div class="case-fir">${c.id}</div>
        <div class="case-title">${esc(c.title)}</div>
        <div class="case-desc">${esc(c.desc)}</div>
        <div class="case-tags">
          <span class="case-tag type-person">${c.jurisdiction}</span>
          <span class="case-tag type-org">${c.type}</span>
          <span class="case-tag">${c.entities} entities</span>
          <span class="case-tag">${c.linkedCases} linked cases</span>
          <span class="badge badge-${c.status==='Active'?'high':c.status==='Under Review'?'med':'muted'}" style="font-size:10px">${c.status}</span>
        </div>
      </div>
      <div class="case-right">
        <div class="case-risk-num" style="color:${riskColor(c.risk)}">${c.risk}</div>
        <div class="case-risk-label">Risk Score</div>
        <div class="case-date">Updated: ${c.lastUpdate}</div>
      </div>
    </div>`).join('');
  document.querySelectorAll('.case-card').forEach(el => el.addEventListener('click', () => openCaseDrawer(el.dataset.cid)));
}

function attachFilterHandlers() {
  document.querySelectorAll('#status-chips .chip').forEach(c => c.addEventListener('click', () => c.classList.toggle('active')));
  const rr = document.getElementById('case-risk-range');
  rr.addEventListener('input', () => document.getElementById('case-risk-val').textContent = rr.value);
  document.getElementById('apply-case-filters').addEventListener('click', applyFilters);
  document.getElementById('sort-select').addEventListener('change', applyFilters);
}

function applyFilters() {
  const statuses = [...document.querySelectorAll('#status-chips .chip.active')].map(c=>c.dataset.status);
  const juris    = document.getElementById('juris-select').value;
  const type     = document.getElementById('type-select').value;
  const minR     = +document.getElementById('case-risk-range').value;
  const sort     = document.getElementById('sort-select')?.value || 'risk';
  let list = cases.filter(c =>
    statuses.includes(c.status) &&
    (!juris || c.jurisdiction.includes(juris)) &&
    (!type || c.type===type) &&
    c.risk >= minR
  );
  if(sort==='risk')   list.sort((a,b)=>b.risk-a.risk);
  if(sort==='status') list.sort((a,b)=>a.status.localeCompare(b.status));
  renderCaseCards(list);
  showToast(`Showing ${list.length} of ${cases.length} cases`);
}

/* ── Case Drawer ────────────────────────────────────────────── */
function openCaseDrawer(cid) {
  const c = cases.find(x=>x.id===cid); if(!c) return;
  document.getElementById('drawer-icon').textContent = c.icon;
  document.getElementById('drawer-title').textContent = c.title;
  document.getElementById('drawer-id').textContent = c.id + ' · ' + c.jurisdiction;
  const sb = document.getElementById('drawer-status-badge');
  sb.className='badge badge-'+(c.status==='Active'?'high':c.status==='Under Review'?'med':'muted');
  sb.textContent = c.status;

  const suspects = c.suspects.map(s=>{
    const n=nodes.find(x=>x.id===s);
    if(!n) return `<div class="suspect-row" style="cursor:pointer" onclick="location.href='dashboard.html?entity='+encodeURIComponent('${esc(s)}')"><div class="suspect-avatar" style="background:#37415c">?</div><div><div class="suspect-name">${esc(s)}</div><div class="suspect-alias">Location / Vehicle</div></div></div>`;
    return `<div class="suspect-row" style="cursor:pointer" onclick="location.href='dashboard.html?entity='+encodeURIComponent('${esc(n.id)}')">
      <div class="suspect-avatar" style="background:${avatarColor(n.type)}">${initials(n.id)}</div>
      <div style="flex:1;min-width:0">
        <div class="suspect-name">${esc(n.id)}${n.alias!=='—'?' <span style="font-weight:400;color:var(--text-dim);font-size:11px">("'+n.alias+'")</span>':''}</div>
        <div class="suspect-alias">${n.type[0].toUpperCase()+n.type.slice(1)} · ${n.jurisdiction}</div>
      </div>
      <span class="suspect-risk" style="color:${riskColor(n.risk)}">${n.risk}</span>
    </div>`;
  }).join('');

  const timeline = c.timeline.map(t=>`
    <div class="timeline-item">
      <div class="timeline-dot">📌</div>
      <div class="timeline-content">
        <div class="timeline-date">${t.date}</div>
        <div class="timeline-text">${esc(t.text)}</div>
      </div>
    </div>`).join('');

  const findings = c.findings.map(f=>`
    <div class="finding">
      <div class="finding-title">🔍 Finding</div>
      <div class="finding-text">${esc(f)}</div>
    </div>`).join('');

  const recs = c.recommendations.map((r,i)=>`
    <div class="rec-item">
      <div class="rec-num">${i+1}</div>
      <div class="rec-text">${esc(r)}</div>
    </div>`).join('');

  document.getElementById('drawer-body').innerHTML = `
    <div>
      <div class="drawer-section-title">Overview</div>
      <div class="card" style="padding:14px">
        <div style="font-size:13.5px;line-height:1.6;color:var(--text-dim)">${esc(c.desc)}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px">
          <div class="stat-box"><div class="n" style="color:${riskColor(c.risk)}">${c.risk}</div><div class="l">Risk Score</div></div>
          <div class="stat-box"><div class="n">${c.entities}</div><div class="l">Entities</div></div>
          <div class="stat-box"><div class="n">${c.linkedCases}</div><div class="l">Linked Cases</div></div>
        </div>
      </div>
    </div>
    <div>
      <div class="drawer-section-title">Suspects &amp; Entities (${c.suspects.length})</div>
      ${suspects}
    </div>
    <div>
      <div class="drawer-section-title">Case Timeline</div>
      <div class="timeline">${timeline}</div>
    </div>
    <div>
      <div class="drawer-section-title">Key Findings</div>
      <div class="findings-list">${findings}</div>
    </div>
    <div>
      <div class="drawer-section-title">Analyst Recommendations</div>
      <div class="recommendations">${recs}</div>
    </div>
    <div style="display:flex;gap:8px;padding-top:8px">
      <button class="btn btn-sm" onclick="location.href='dashboard.html?case='+encodeURIComponent('${esc(c.id)}')">View in Network Graph</button>
      <button class="btn ghost btn-sm" onclick="showToast('Case evidence manifest exported as court-admissible PDF','ok')">Export Evidence</button>
      ${c.status!=='Closed'?`<button class="btn ghost btn-sm danger" onclick="showToast('Case escalation flagged to NCRB &amp; State Special Task Force')">Escalate</button>`:''}
    </div>`;

  document.getElementById('drawer-report-btn').onclick = () => {
    showToast(`Generating forensic report for ${c.title}…`, 'ok');
    setTimeout(() => location.href = 'reports.html?case=' + encodeURIComponent(c.id), 500);
  };
  document.getElementById('drawer-overlay').classList.add('show');
}

document.getElementById('drawer-close-btn').addEventListener('click', () => document.getElementById('drawer-overlay').classList.remove('show'));
document.getElementById('drawer-overlay').addEventListener('click', e => { if(e.target===e.currentTarget) document.getElementById('drawer-overlay').classList.remove('show'); });
document.addEventListener('keydown', e => { if(e.key==='Escape') document.getElementById('drawer-overlay').classList.remove('show'); });

/* ── New Case Modal ─────────────────────────────────────────── */
document.getElementById('new-case-btn').addEventListener('click', () => document.getElementById('new-case-overlay').classList.add('show'));
document.getElementById('close-new-case').addEventListener('click', () => document.getElementById('new-case-overlay').classList.remove('show'));
document.getElementById('new-case-overlay').addEventListener('click', e => { if(e.target===e.currentTarget) document.getElementById('new-case-overlay').classList.remove('show'); });
document.getElementById('create-case-btn').addEventListener('click', () => {
  const fir   = document.getElementById('nc-fir').value.trim();
  const title = document.getElementById('nc-title').value.trim();
  const desc  = document.getElementById('nc-desc').value.trim();
  const type  = document.getElementById('nc-type').value;
  const juris = document.getElementById('nc-juris').value;
  const risk  = +document.getElementById('nc-risk').value;
  if(!fir||!title){ showToast('Enter FIR number and case title','error'); return; }
  const btn = document.getElementById('create-case-btn');
  btn.textContent='Creating…'; btn.disabled=true;
  setTimeout(()=>{
    const newCase = {
      id: fir, title, desc: desc || `Investigation into ${title} registered under jurisdiction ${juris}.`,
      type, jurisdiction: juris, risk, riskLevel: risk > 70 ? 'high' : risk > 40 ? 'med' : 'low',
      cluster: juris.includes('Delhi') ? 1 : juris.includes('Karn') ? 2 : 0,
      status: 'Active', opened: 'Today', lastUpdate: 'Just now', suspects: ['Imran W.', 'Vikram S.'],
      entities: 2, linkedCases: 1, icon: '📁',
      timeline: [{date: 'Today', text: `FIR ${fir} officially lodged and assigned to Cyber Cell.`}],
      findings: [`Case initiated under ${type} category.`, `Cross-cluster associations pending analysis.`],
      recommendations: ['Begin multi-source entity mapping.', 'Synchronise CDR with state CCTNS database.']
    };
    cases.unshift(newCase);
    renderCases(cases);
    showToast(`Case ${fir} created and assigned to network graph`,'ok');
    document.getElementById('new-case-overlay').classList.remove('show');
    btn.textContent='Create Case & Assign to Network'; btn.disabled=false;
    document.getElementById('nc-fir').value = '';
    document.getElementById('nc-title').value = '';
    document.getElementById('nc-desc').value = '';
  },600);
});

/* ── Search ─────────────────────────────────────────────────── */
document.getElementById('cases-search').addEventListener('input', e => {
  const q=e.target.value.trim().toLowerCase();
  const list=!q?cases:cases.filter(c=>c.title.toLowerCase().includes(q)||c.id.toLowerCase().includes(q)||c.desc.toLowerCase().includes(q)||c.suspects.some(s=>s.toLowerCase().includes(q)));
  renderCaseCards(list);
});

/* ── Init ───────────────────────────────────────────────────── */
renderCases(cases);

// Handle URL parameter to auto-open case drawer
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const openCid = params.get('open');
  if (openCid) {
    const match = cases.find(c => c.id.toLowerCase() === openCid.toLowerCase());
    if (match) {
      setTimeout(() => openCaseDrawer(match.id), 300);
      showToast(`Loaded Case ${match.id} details`, 'ok');
    }
  }
});
</script>
</body>
</html>
